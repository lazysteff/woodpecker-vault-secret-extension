apiVersion: v1
kind: ConfigMap
metadata:
  name: woodpecker-vault-secret-extension-config
data:
  config.yml: |
    server:
      listen_addr: ":8080"
      read_timeout: "5s"
      write_timeout: "10s"
      idle_timeout: "60s"
      max_body_bytes: 1048576
    logging:
      level: "info"
      format: "json"
    woodpecker:
      public_key_file: "/run/secrets/woodpecker_extension_public_key"
      netrc:
        enabled: false
    vault:
      address: "https://vault.example.com"
      namespace: ""
      auth:
        method: "approle"
        mount_path: "approle"
        role_id_file: "/run/secrets/vault_role_id"
        secret_id_file: "/run/secrets/vault_secret_id"
      kv:
        version: 2
        mount: "kv"
      request_timeout: "5s"
      token_renewal: true
    rules:
      - id: "example-main"
        repo: "example/repo"
        events: ["push"]
        branches: ["main"]
        allow_pull_requests: false
        allow_forks: false
        partial: false
        secrets:
          - name: "VAULT_ADDR"
            path: "cicd/woodpecker/deploy"
            field: "vault_addr"
            events: ["push"]
---
apiVersion: v1
kind: Secret
metadata:
  name: woodpecker-vault-secret-extension-secrets
type: Opaque
stringData:
  woodpecker_extension_public_key: |
    -----BEGIN PUBLIC KEY-----
    replace-with-woodpecker-extension-public-key
    -----END PUBLIC KEY-----
  vault_role_id: "replace-with-role-id"
  vault_secret_id: "replace-with-secret-id"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woodpecker-vault-secret-extension
spec:
  replicas: 2
  selector:
    matchLabels:
      app: woodpecker-vault-secret-extension
  template:
    metadata:
      labels:
        app: woodpecker-vault-secret-extension
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woodpecker-vault-secret-extension
          image: woodpecker-vault-secret-extension:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_FILE
              value: /config/config.yml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: woodpecker-vault-secret-extension-config
        - name: secrets
          secret:
            secretName: woodpecker-vault-secret-extension-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: woodpecker-vault-secret-extension
spec:
  selector:
    app: woodpecker-vault-secret-extension
  ports:
    - name: http
      port: 8080
      targetPort: http
